<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UCH Grossing Manual</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #000000;
    }

    /* CU Gold accent across top */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background-color: #CFB87C;
    }

    .container {
      max-width: 650px;
      padding: 40px 25px;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 12px 0;
      color: #000000;
    }

    .gold-line {
      width: 80px;
      height: 4px;
      background-color: #CFB87C;
      margin: 0 auto 30px auto;
      border-radius: 2px;
    }

    .moved {
      font-size: 21px;
      font-weight: bold;
      color: #434343;
      margin-bottom: 18px;
    }

    .redirect {
      font-size: 17px;
      color: #434343;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .button {
      display: inline-block;
      background-color: #CFB87C;
      color: #000000;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .button:hover {
      background-color: #bcbcbc;
    }

    .note {
      margin-top: 28px;
      font-size: 13px;
      color: #434343;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>UCH Grossing Manual</h1>

    <div class="gold-line"></div>

    <p class="moved">
      The UCH Grossing Manual has moved.
    </p>

    <p class="redirect">
      Moving forward, please access the manual at its new location.
    </p>

    <a
      class="button"
      href="https://gross-pathology-manual-uch.github.io/Path/"
    >
      Access the UCH Grossing Manual
    </a>

    <p class="note">
      Please update any saved bookmarks to the new site.
    </p>

  </main>

</body>
</html>
