<!DOCTYPE html>
<html>
<head>
  <title>UCH Grossing Manual</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #000000;
    }

    /* CU Gold accent across top */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background-color: #CFB87C;
    }

    .container {
      max-width: 650px;
      padding: 40px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 12px;
      color: #000000;
    }

    .gold-line {
      width: 80px;
      height: 4px;
      background-color: #CFB87C;
      margin: 0 auto 30px auto;
      border-radius: 2px;
    }

    .unavailable {
      font-size: 20px;
      color: #434343;
      margin-bottom: 30px;
    }

    .redirect {
      font-size: 16px;
      color: #434343;
      line-height: 1.6;
    }

    a {
      color: #000000;
      font-weight: bold;
      text-decoration-color: #CFB87C;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    a:hover {
      color: #434343;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>UCH Grossing Manual</h1>
    <div class="gold-line"></div>

    <p class="unavailable">
      This site is temporarily unavailable.
    </p>

    <p class="redirect">
      Please access the UCH Grossing Manual at:<br>
      <a href="https://gross-pathology-manual-uch.github.io/Path/">
        https://gross-pathology-manual-uch.github.io/Path/
      </a>
    </p>
  </div>
</body>
</html>
